/* ---------------- 通用绘图助手 ---------------- */
function rr(ctx, x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function txt(ctx, str, x, y, size, color, align, weight, maxWidth) {
  ctx.font = (weight || 600) + ' ' + size + 'px "Microsoft YaHei","PingFang SC",system-ui,sans-serif';
  ctx.fillStyle = color;
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'middle';
  if (maxWidth) ctx.fillText(str, x, y, maxWidth);
  else ctx.fillText(str, x, y);
}
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function dist2(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }

/* ---------------- 音效（程序生成，无外部文件） ---------------- */
let AC = null;
let muted = false;
function sfx(freq, dur, type, vol) {
  if (muted) return;
  try {
    const Ctx = global.AudioContext || global.webkitAudioContext;
    if (!Ctx) return;
    if (!AC) AC = new Ctx();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    const v = vol == null ? 0.04 : vol;
    const t = AC.currentTime;
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur + 0.03);
  } catch (e) { /* 静默失败，不影响游戏 */ }
}

/* ---------------- 关卡地图 ----------------
   每张地图由折线航点定义，运行时展开成路径点、累计长度与占地格。
   关卡只影响地形，敌人 / 塔等数值表与地图解耦。 */
function cellCX(c) { return c * CELL + CELL / 2; }
function cellCY(r) { return FIELD_Y + r * CELL + CELL / 2; }

function buildPath(wp) {
  const pts = wp.map(function (p) { return { x: cellCX(p[0]), y: cellCY(p[1]) }; });
  const cum = [0];
  for (let i = 1; i < pts.length; i++) {
    const d = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    cum.push(cum[i - 1] + d);
  }
  const cells = {};
  for (let i = 1; i < wp.length; i++) {
    const a = wp[i - 1], b = wp[i];
    const dc = Math.sign(b[0] - a[0]), dr = Math.sign(b[1] - a[1]);
    if (dc === 0 && dr === 0) continue; // 重复航点直接跳过，避免死循环
    let c = a[0], r = a[1];
    cells[c + ',' + r] = 1;
    while (c !== b[0] || r !== b[1]) {
      c += dc; r += dr;
      cells[c + ',' + r] = 1;
    }
  }
  return { pts: pts, cum: cum, total: cum[cum.length - 1], cells: cells };
}

function posAt(d, path) {
  const P = path || PATH;
  const cum = P.cum, pts = P.pts;
  if (d <= 0) return { x: pts[0].x, y: pts[0].y, ang: 0 };
  if (d >= P.total) {
    const n = pts.length;
    return { x: pts[n - 1].x, y: pts[n - 1].y, ang: Math.atan2(pts[n - 1].y - pts[n - 2].y, pts[n - 1].x - pts[n - 2].x) };
  }
  let i = 1;
  while (i < cum.length && cum[i] < d) i++;
  const segLen = cum[i] - cum[i - 1] || 1;
  const t = (d - cum[i - 1]) / segLen;
  const a = pts[i - 1], b = pts[i];
  return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, ang: Math.atan2(b.y - a.y, b.x - a.x) };
}

/* 波次定义：查表（战役 / 熔渊各一张）；无尽模式第 16 波起由程序生成，强度持续攀升，逢 5 的波次首领压阵 */
function waveDef(w, mode) {
  const list = wavesOf(mode);
  if (w <= list.length) return list[w - 1];
  if (mode !== 'endless') return [];
  const k = w - list.length;
  const groups = [
    { t: 'grunt', n: 10 + 2 * k, gap: Math.max(0.22, 0.4 - 0.008 * k) },
    { t: 'runner', n: 8 + 2 * k, gap: Math.max(0.18, 0.26 - 0.004 * k) },
    { t: 'splitter', n: 5 + k, gap: 0.5 },
    { t: 'shield', n: 4 + Math.floor(k * 0.8), gap: Math.max(0.45, 0.8 - 0.008 * k) },
    { t: 'medic', n: 1 + Math.floor(k * 0.4), gap: 2.2 },
    { t: 'tank', n: 3 + k, gap: Math.max(0.5, 0.85 - 0.01 * k) },
    { t: 'berserker', n: 1 + Math.floor(k * 0.5), gap: Math.max(0.8, 2.2 - 0.03 * k) },
    { t: 'swarm', n: 8 + 2 * k, gap: Math.max(0.14, 0.24 - 0.003 * k) }
  ];
  if (w % 5 === 0) groups.unshift({ t: 'boss', n: Math.max(1, Math.floor(w / 15)), gap: 3.0 });
  return groups;
}

/* 无尽模式最佳纪录（localStorage 可能不可用，需保护） */
function loadEndlessBest() {
  try {
    const v = Number(localStorage.getItem('TD_ENDLESS_BEST') || 0);
    return Number.isFinite(v) && v > 0 ? Math.floor(v) : 0;
  } catch (e) { return 0; }
}
function saveEndlessBest(wave) {
  try {
    const v = Number.isFinite(wave) && wave > 0 ? Math.floor(wave) : 0;
    if (v > loadEndlessBest()) localStorage.setItem('TD_ENDLESS_BEST', String(v));
  } catch (e) { /* 隐私模式等场景下静默跳过 */ }
}

/* ---------------- 存档（断点续战） ----------------

const SAVE_KEY = 'TD_SAVE_V1';
function snapshot(s) {
  if (!s || s.scene !== 'play') return null;
  return {
    v: 1, mode: s.mode, paused: s.paused, speed: s.speed || 1, time: s.time,
    gold: s.gold, lives: s.lives, maxLives: s.maxLives, score: s.score,

    autoUp: !!s.autoUp, autoMode: s.autoMode || 'smart',
    autoOrigin: s.autoOrigin ? { c: s.autoOrigin.c, r: s.autoOrigin.r } : null,
    stat: { kills: s.stat.kills, built: s.stat.built, leaked: s.stat.leaked, goldEarned: s.stat.goldEarned },
    towers: s.towers.map(function (t) {
      return { id: t.id, key: t.key, c: t.c, r: t.r, x: t.x, y: t.y, level: t.level, cd: t.cd, ang: t.ang, invested: t.invested, kills: t.kills };
    }),

        if (s.gold - cost < AUTO_RESERVE) continue;

        if (score > best) { best = score; target = t; }
      }
    } else {
      /* 有序模式：按顺序取第一座升得起、且不动用建塔储备的塔 */
      for (let i = 0; i < list.length; i++) {
        const t = list[i];
        if (t.level >= MAX_LV) continue;
        const cost = upgradeCost(t);
        if (s.gold - cost < AUTO_RESERVE) continue;
        target = t;
        break;
      }
    }
    if (!target) break;
    if (!upgradeTower(s, target, true).ok) break;
    addFloat(s, target.x, target.y - 16, 'Lv.' + target.level, C.good);
    done++;
  }
}
function sellTower(s, t) {
  if (!t || s.occ[t.c + ',' + t.r] !== t || s.towers.indexOf(t) < 0) return { ok: false, why: '防御塔已不存在' };
  const back = sellValue(t);
  s.gold += back;
  s.stat.goldEarned += back;
  delete s.occ[t.c + ',' + t.r];
  const i = s.towers.indexOf(t);
  if (i >= 0) s.towers.splice(i, 1);
  if (s.sel === t) s.sel = null;
  addFloat(s, t.x, t.y - 6, '+' + back, C.gold);
  addEffect(s, { kind: 'ring', x: t.x, y: t.y, r0: 26, r1: 4, color: C.gold, life: 0.3 });
  sfx(300, 0.1, 'sine', 0.05);
  return { ok: true, value: back };
}

/* ---------------- 波次 ---------------- */
function startWave(s) {
  if (s.scene !== 'play' || s.paused || s.phase !== 'prep') return;
  const total = totalWaves(s.mode);
  if (s.mode !== 'endless' && s.wave >= total) return;
  s.wave++;
  s.phase = 'spawning';
  s.spawnTimer = 0.35;
  s.spawnQueue = [];
  const def = waveDef(s.wave, s.mode);
  for (let i = 0; i < def.length; i++) {
    const g = def[i];
    for (let k = 0; k < g.n; k++) s.spawnQueue.push({ t: g.t, gap: g.gap });
  }
  const label = s.mode === 'endless'
    ? (s.wave > TOTAL_WAVES ? '无尽 · 第 ' + s.wave + ' 波' : '第 ' + s.wave + ' 波 · ∞')
    : (LEVELS[s.level].name + ' · 第 ' + s.wave + ' / ' + total + ' 波');
  s.banner = { main: label, sub: waveSummary(s.wave - 1, s.mode), t: 2.6 };
  sfx(240, 0.16, 'sawtooth', 0.05);
}
function callWaveEarly(s) {
  if (s.scene !== 'play' || s.paused || s.phase !== 'prep') return;
  // 先验证波次再发奖励，避免战役结束后重复领取提前召唤金币
  if (s.mode !== 'endless' && s.wave >= totalWaves(s.mode)) return;
  const bonus = Math.floor(s.prepLeft * 2.5);
  if (bonus > 0) {
    s.gold += bonus;
    s.stat.goldEarned += bonus;
    addFloat(s, 470, BAR_Y + 40, '提前召唤 +' + bonus, C.gold);
  }
  s.prepLeft = 0;
  startWave(s);
}
function completeWave(s) {
  const total = totalWaves(s.mode);
  const bonus = 25 + s.wave * 10;
  s.gold += bonus;
  s.stat.goldEarned += bonus;
  s.score += 80 * s.wave;
  if (s.wave >= total && s.mode !== 'endless') { finishGame(s, true); return; }
  s.phase = 'prep';
  s.prepTotal = s.wave >= total - 1 ? 12 : 10;
  s.prepLeft = s.prepTotal;
  s.banner = { main: '第 ' + s.wave + ' 波 已清除', sub: '奖励 +' + bonus + ' 金币', t: 2.2 };
  saveGame(s);
  sfx(600, 0.1, 'sine', 0.05);
  setTimeout(function () { sfx(760, 0.12, 'sine', 0.05); }, 110);
}
function finishGame(s, win) {
  clearSave(); // 对局结束，存档失效
  s.scene = win ? 'win' : 'lose';
  if (win) {
    s.score += s.lives * 50 + Math.floor(s.gold * 0.5);
    sfx(660, 0.16, 'sine', 0.06);
  } else {
    if (s.mode === 'endless') saveEndlessBest(s.wave);
    sfx(120, 0.4, 'sawtooth', 0.06);
  }
}

/* ---------------- 敌人 ---------------- */
function spawnEnemy(s, type, dist) {
  const def = ENEMIES[type];
  if (!def) return null;
  const d = diffOf(s.mode);
  const sc = hpScale(s.wave, s.mode);
  const hp = Math.round(def.hp * sc);
  const d0 = Number.isFinite(dist) ? Math.max(0, dist) : 0;
  const p = posAt(d0, s.path);
  const e = {
    id: s.nextId++, type: type, x: p.x, y: p.y, dist: d0,
    hp: hp, maxHp: hp,
    speed: def.speed * d.spdMul * (1 + 0.012 * (s.wave - 1)),
    slowT: 0, slowMul: 1, r: def.r, armor: def.armor,
    shield: Math.round((def.shield || 0) * sc), maxShield: Math.round((def.shield || 0) * sc),
    shieldRegen: (def.shieldRegen || 0) * sc, shieldDelay: def.shieldDelay || 0, shieldT: 0,
    poisonDps: 0, poisonT: 0, poisonSrc: null, shred: 0, shredT: 0,
    healR: def.healR || 0, healRate: (def.healRate || 0) * sc, healFx: 0,
    rage: def.rage || 0,
    gold: def.gold, leak: def.leak, score: def.score,
    color: def.color, shape: def.shape, ang: p.ang, hitT: 0, dead: false, wob: Math.random() * 6.28
  };
  s.enemies.push(e);
  return e;
}

function damageEnemy(s, e, dmg, srcTower, isDot) {
  if (e.dead || dmg <= 0) return;
  let real = dmg;
  if (e.shield > 0) {
    const absorbed = Math.min(e.shield, real);
    e.shield -= absorbed;
    real -= absorbed;
  }
  if (e.shieldDelay) e.shieldT = e.shieldDelay;
  if (real > 0) {
    const armor = Math.max(0, (e.armor || 0) - (e.shredT > 0 ? e.shred || 0 : 0));
    e.hp -= real * (1 - Math.min(0.9, armor));
  }
  if (!isDot) e.hitT = 0.12;
  if (e.hp <= 0) {
    e.dead = true;
    s.gold += e.gold;
    s.stat.goldEarned += e.gold;
    s.stat.kills++;
    s.score += e.score;
    if (srcTower) srcTower.kills++;
    addFloat(s, e.x, e.y - e.r - 6, '+' + e.gold, C.gold);
    addEffect(s, { kind: 'pop', x: e.x, y: e.y, r: e.r, color: e.color, life: 0.32 });
    sfx(e.shape === 'boss' ? 160 : 380, 0.07, 'square', 0.03);
    // 死亡分裂：在倒下的位置钻出小敌人
    const def = ENEMIES[e.type];
    if (def && def.splitInto) {
      for (let i = 0; i < (def.splitN || 2); i++) {
        spawnEnemy(s, def.splitInto, e.dist + (i === 0 ? -8 : 8));
      }
      addEffect(s, { kind: 'ring', x: e.x, y: e.y, r0: 4, r1: 26, color: def.color, life: 0.3 });
    }
  }
}
function areaDamage(s, x, y, radius, dmg, slow, slowDur, srcTower) {
  // 缓存长度：死亡分裂等方式新增的敌人不会被同一次爆炸波及
  const n = s.enemies.length;
  for (let i = 0; i < n; i++) {
    const e = s.enemies[i];
    if (e.dead) continue;
    const rr2 = radius + e.r;
    if (dist2(x, y, e.x, e.y) <= rr2 * rr2) {
      damageEnemy(s, e, dmg, srcTower);
      if (slow && !e.dead) applySlow(e, slow, slowDur);
    }
  }
}
function applySlow(e, mul, dur) {
  if (e.slowT <= 0.15 || mul < e.slowMul) {
    e.slowMul = mul;
    e.slowT = dur;
  } else if (mul === e.slowMul) {
    e.slowT = Math.max(e.slowT, dur);
  }
}
function applyVenom(s, e, shot) {
  if (e.dead || !shot.poisonDps) return;
  // 毒素不叠加：保留最强伤害，较弱攻击只刷新已有持续时间
  if (e.poisonT <= 0 || shot.poisonDps >= (e.poisonDps || 0)) {
    e.poisonDps = shot.poisonDps;
    e.poisonSrc = shot.src;
  }
  e.poisonT = Math.max(e.poisonT || 0, shot.poisonDur);
  e.shred = Math.max(e.shred || 0, shot.shred || 0);
  e.shredT = Math.max(e.shredT || 0, shot.shredDur || 0);
}

/* ---------------- 防御塔开火 ---------------- */
function pickTarget(s, t, range) {
  let best = null, bestD = -1;
  for (let i = 0; i < s.enemies.length; i++) {
    const e = s.enemies[i];
    if (e.dead) continue;
    const rr2 = range + e.r * 0.6;
    if (dist2(t.x, t.y, e.x, e.y) <= rr2 * rr2) {
      if (e.dist > bestD) { bestD = e.dist; best = e; }
    }
  }
  return best;
}
/* 磁暴塔：闪电在敌群间跳跃，每跳一次伤害衰减 */
function chainLightning(s, t, target, st) {
  const def = TOWERS[t.key];
  const maxHop = def.chain || 3;
  const falloff = def.falloff || 0.7;
  const cr2 = (def.chainR || 96) * (def.chainR || 96);
  let from = { x: t.x, y: t.y };
  let cur = target;
  let dmg = st.dmg;
  const hitList = [];
  for (let hop = 0; hop < maxHop && cur; hop++) {
    addEffect(s, { kind: 'beam', x1: from.x, y1: from.y, x2: cur.x, y2: cur.y, color: def.color, life: 0.15 });
    damageEnemy(s, cur, dmg, t);
    hitList.push(cur);
    from = cur;
    dmg *= falloff;
    let next = null, bd = Infinity;
    for (let i = 0; i < s.enemies.length; i++) {
      const e2 = s.enemies[i];
      if (e2.dead || hitList.indexOf(e2) >= 0) continue;
      const dd = dist2(from.x, from.y, e2.x, e2.y);
      if (dd <= cr2 && dd < bd) { bd = dd; next = e2; }
    }
    cur = next;
  }
}

function fire(s, t, st, target) {
  const def = TOWERS[t.key];
  if (!def || def.proj === 'none') return; // 支援型防御塔只提供光环，不开火
  if (def.proj === 'homing') {
    s.shots.push({
      kind: 'homing', x: t.x + Math.cos(t.ang) * 14, y: t.y + Math.sin(t.ang) * 14,
      target: target, dmg: st.dmg, speed: def.pspd, color: def.color,
      splash: 0, slow: 0, slowDur: 0, src: t, ang: t.ang, life: 3,
      poisonDps: st.poisonDps, poisonDur: st.poisonDur, shred: st.shred, shredDur: st.shredDur
    });
    sfx(900, 0.04, 'square', 0.018);
  } else if (def.proj === 'shell') {
    const d = Math.hypot(target.x - t.x, target.y - t.y);
    const flight = d / def.pspd;
    const moveMul = target.slowT > 0 ? target.slowMul : 1;
    /* 落点必须按当前关卡的路径推算，否则换图后炮弹会打到别的地图的坐标上 */
    const pred = posAt(target.dist + target.speed * moveMul * flight * 0.9, s.path);
    s.shots.push({
      kind: 'shell', x: t.x, y: t.y, sx: t.x, sy: t.y, tx: pred.x, ty: pred.y,
      dmg: st.dmg, speed: def.pspd, color: def.color, splash: st.splash,
      slow: 0, slowDur: 0, src: t, t: 0, dur: Math.max(0.25, flight), arcs: 1
    });
    sfx(220, 0.09, 'triangle', 0.03);
  } else if (def.proj === 'frost') {
    s.shots.push({
      kind: 'frost', x: t.x, y: t.y, tx: target.x, ty: target.y, target: target,
      dmg: st.dmg, speed: 760, color: def.color, splash: st.splash,
      slow: st.slow, slowDur: st.slowDur, src: t, life: 1.4
    });
    sfx(1180, 0.05, 'sine', 0.02);
  } else if (def.proj === 'beam') {
    areaDamage(s, target.x, target.y, 0, st.dmg, 0, 0, t);
    addEffect(s, { kind: 'beam', x1: t.x, y1: t.y, x2: target.x, y2: target.y, color: def.color, life: 0.17 });
    sfx(1500, 0.06, 'square', 0.02);
  } else if (def.proj === 'chain') {
    chainLightning(s, t, target, st);
    sfx(1320, 0.05, 'sawtooth', 0.022);
  }
  t.flash = 0.08;
}

/* ---------------- 特效 / 飘字 ---------------- */
function addEffect(s, fx) {
  fx.t = 0;
  s.effects.push(fx);
  if (s.effects.length > 260) s.effects.shift();
}
function addFloat(s, x, y, text, color) {
  s.floats.push({ x: x, y: y, text: text, color: color, life: 0.9, t: 0 });
  if (s.floats.length > 90) s.floats.shift();
}

/* ---------------- 主更新 ---------------- */
/* 清理阵亡单位（漏怪判负时提前返回会跳过收尾，必须先清场避免尸体残留） */
function clearDead(s) {
  let dirty = false;
  for (let i = s.enemies.length - 1; i >= 0; i--) if (s.enemies[i].dead) { s.enemies.splice(i, 1); dirty = true; }
  return dirty;
}
function step(s, dt) {
  if (!s || s.scene !== 'play' || s.paused || !Number.isFinite(dt) || dt <= 0) return;
  const d = Math.min(dt, 0.05) * s.speed;
  s.time += d;
  if (s.banner) { s.banner.t -= d; if (s.banner.t <= 0) s.banner = null; }
  if (s.hint > 0) s.hint -= d;
  if (s.shake > 0) s.shake = Math.max(0, s.shake - d * 26);
  if (s.saveFlash > 0) s.saveFlash = Math.max(0, s.saveFlash - d);

  /* 自动存档：游戏进行中每 4 秒写一次，刷新即续战 */
  s.saveT += d;
  if (s.saveT >= 4) { s.saveT = 0; if (saveGame(s)) s.saveFlash = 1.6; }

  /* 自动升级：把多余金币按所选顺序投进防御塔 */
  autoUpgradeTick(s, dt);

  /* 波次推进 */
  if (s.phase === 'prep') {
    s.prepLeft -= d;
    if (s.prepLeft <= 0) startWave(s);
  } else if (s.phase === 'spawning') {
    s.spawnTimer -= d;
    let guard = 0;
    while (s.spawnTimer <= 0 && s.spawnQueue.length && guard++ < 40) {
      const item = s.spawnQueue.shift();
      spawnEnemy(s, item.t);
      s.spawnTimer += item.gap;
    }
    if (!s.spawnQueue.length) s.phase = 'clearing';
  } else if (s.phase === 'clearing') {
    if (!s.enemies.length) completeWave(s);
    if (s.scene !== 'play') return;
  }

  /* 敌人状态与移动（缓存数量：本帧分裂出的幼虫从下一帧开始更新） */
  const enemyN = s.enemies.length;
  for (let i = 0; i < enemyN; i++) {
    const e = s.enemies[i];
    if (e.dead) continue;
    if (e.poisonT > 0 && e.poisonDps > 0) {
      damageEnemy(s, e, e.poisonDps * d, e.poisonSrc, true);
      e.poisonT = Math.max(0, e.poisonT - d);
      if (e.dead) continue;
      if (e.poisonT <= 0) { e.poisonDps = 0; e.poisonSrc = null; }
    }
    if (e.shredT > 0) {
      e.shredT = Math.max(0, e.shredT - d);
      if (e.shredT <= 0) e.shred = 0;
    }
    if (e.shieldT > 0) e.shieldT = Math.max(0, e.shieldT - d);
    if (e.maxShield > 0 && e.shield < e.maxShield && e.shieldT <= 0 && e.poisonT <= 0) {
      e.shield = Math.min(e.maxShield, e.shield + e.shieldRegen * d);
    }
    /* 医疗兵治疗光环：恢复光环内受伤同伴的生命（不自愈、不越上限） */
    if (e.healRate > 0) {
      e.healFx -= d;
      let pulsed = false;
      for (let j = 0; j < enemyN; j++) {
        const o = s.enemies[j];
        if (o === e || o.dead || o.hp >= o.maxHp) continue;
        if (Math.hypot(o.x - e.x, o.y - e.y) > e.healR) continue;
        o.hp = Math.min(o.maxHp, o.hp + e.healRate * d);
        pulsed = true;
      }
      if (pulsed && e.healFx <= 0) {
        e.healFx = 0.8;
        addEffect(s, { kind: 'ring', x: e.x, y: e.y, r0: e.r + 4, r1: e.healR, color: '#7dffa8', life: 0.5 });
      }
    }
    if (e.slowT > 0) {
      e.slowT -= d;
      if (e.slowT <= 0) { e.slowT = 0; e.slowMul = 1; }
    }
    if (e.hitT > 0) e.hitT -= d;
    const mul = e.slowT > 0 ? e.slowMul : 1;
    /* 狂怒兽：血量越低跑得越快（最高 rage 倍率） */
    let spd = e.speed * mul;
    if (e.rage) spd *= 1 + e.rage * (1 - clamp(e.hp / e.maxHp, 0, 1));
    e.dist += spd * d;
    const p = posAt(e.dist, s.path);
    e.x = p.x; e.y = p.y; e.ang = p.ang;
    e.wob += d * 6;
    if (e.dist >= s.path.total) {
      e.dead = true;
      s.lives -= e.leak;
      s.stat.leaked++;
      s.shake = 8;
      addFloat(s, s.base.cx - 20, s.base.cy - 40, '-' + e.leak + ' 生命', C.life);
      addEffect(s, { kind: 'ring', x: s.base.cx - 20, y: s.base.cy, r0: 10, r1: 54, color: C.life, life: 0.4 });
      sfx(140, 0.18, 'sawtooth', 0.05);
      if (s.lives <= 0) { s.lives = 0; clearDead(s); finishGame(s, false); return; }
    }
  }

  /* 防御塔 */
  for (let i = 0; i < s.towers.length; i++) {
    const t = s.towers[i];
    const st = towerStats(t, s);
    if (t.flash > 0) t.flash -= d;
    if (t.cd > 0) t.cd -= d;
    const target = pickTarget(s, t, st.range);
    if (target) {
      const want = Math.atan2(target.y - t.y, target.x - t.x);
      let diff = want - t.ang;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      t.ang += clamp(diff, -7 * d, 7 * d);
      /* 支援型防御塔（增幅塔）不参与开火 */
      if (t.cd <= 0 && st.rate > 0) { fire(s, t, st, target); t.cd = 1 / st.rate; }
    }
  }

  /* 子弹 */
  for (let i = s.shots.length - 1; i >= 0; i--) {
    const sh = s.shots[i];
    let dead = false;
    if (sh.kind === 'homing') {
      const tg = sh.target;
      if (!tg || tg.dead) { dead = true; }
      else {
        const dx = tg.x - sh.x, dy = tg.y - sh.y;
        const len = Math.hypot(dx, dy);
        const mv = sh.speed * d;
        sh.ang = Math.atan2(dy, dx);
        if (len <= mv + tg.r * 0.5) {
          damageEnemy(s, tg, sh.dmg, sh.src);
          if (!tg.dead) applyVenom(s, tg, sh);
          addEffect(s, { kind: 'spark', x: tg.x, y: tg.y, color: sh.color, life: 0.16 });
          dead = true;
        } else {
          sh.x += dx / len * mv; sh.y += dy / len * mv;
        }
      }
    } else if (sh.kind === 'frost') {
      const tg = sh.target;
      if (!tg || tg.dead) { dead = true; }
      else {
        sh.tx = tg.x; sh.ty = tg.y;
        const dx = sh.tx - sh.x, dy = sh.ty - sh.y;
        const len = Math.hypot(dx, dy);
        const mv = sh.speed * d;
        if (len <= mv + tg.r * 0.5) {
          areaDamage(s, tg.x, tg.y, sh.splash, sh.dmg, sh.slow, sh.slowDur, sh.src);
          addEffect(s, { kind: 'ring', x: tg.x, y: tg.y, r0: 6, r1: sh.splash + 12, color: C.slow, life: 0.28 });
          dead = true;
        } else {
          sh.x += dx / len * mv; sh.y += dy / len * mv;
        }
      }
    } else if (sh.kind === 'shell') {
      sh.t += d;
      const k = clamp(sh.t / sh.dur, 0, 1);
      sh.x = sh.sx + (sh.tx - sh.sx) * k;
      sh.y = sh.sy + (sh.ty - sh.sy) * k;
      if (k >= 1) {
        areaDamage(s, sh.tx, sh.ty, sh.splash, sh.dmg, 0, 0, sh.src);
        addEffect(s, { kind: 'boom', x: sh.tx, y: sh.ty, r: sh.splash, color: sh.color, life: 0.36 });
        sfx(180, 0.12, 'sawtooth', 0.035);
        dead = true;
      }
    }
    if (dead) s.shots.splice(i, 1);
  }

  /* 特效 / 飘字老化 */
  for (let i = s.effects.length - 1; i >= 0; i--) {
    const fx = s.effects[i];
    fx.t += d;
    if (fx.t >= fx.life) s.effects.splice(i, 1);
  }
  for (let i = s.floats.length - 1; i >= 0; i--) {
    const f = s.floats[i];
    f.t += d;
    f.y -= 26 * d;
    if (f.t >= f.life) s.floats.splice(i, 1);
  }

  /* 清理死亡单位 */
  if (s.enemies.length) {
    const dirty = clearDead(s);
    if (dirty && s.sel === null && s.pick) { /* 保持选择状态 */ }
  }
}

/* =========================================================
   渲染
   ========================================================= */
function drawField(ctx) {
  ctx.save();
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      ctx.fillStyle = ((r + c) % 2 === 0) ? C.bgA : C.bgB;
      ctx.fillRect(c * CELL, FIELD_Y + r * CELL, CELL, CELL);
    }
  }
  ctx.strokeStyle = C.bgLine;
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let c = 1; c < COLS; c++) { ctx.moveTo(c * CELL + .5, FIELD_Y); ctx.lineTo(c * CELL + .5, BAR_Y); }
  for (let r = 1; r < ROWS; r++) { ctx.moveTo(0, FIELD_Y + r * CELL + .5); ctx.lineTo(W, FIELD_Y + r * CELL + .5); }
  ctx.stroke();
  ctx.restore();
}

function drawPath(ctx, s) {
  const pts = s.path.pts;
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.strokeStyle = C.pathEdge;
  ctx.lineWidth = CELL * 0.92;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.stroke();
  ctx.strokeStyle = C.path;
  ctx.lineWidth = CELL * 0.72;
  ctx.stroke();
  // 路面虚线
  ctx.strokeStyle = 'rgba(255,255,255,.22)';
  ctx.lineWidth = 3;
  ctx.setLineDash([10, 16]);
  ctx.lineDashOffset = -(s.time * 26) % 26;
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawBase(ctx, s) {
  const pct = s.lives / s.maxLives;
  const cx = s.base.cx, cy = s.base.cy, w = s.base.w, h = s.base.h;
  ctx.save();
  // 光晕
  const g = ctx.createRadialGradient(cx, cy, 10, cx, cy, 92);
  g.addColorStop(0, 'rgba(110,203,255,.28)');
  g.addColorStop(1, 'rgba(110,203,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy, 92, 0, Math.PI * 2); ctx.fill();

  // 主体
  rr(ctx, cx - w / 2, cy - h / 2, w, h, 12);
  ctx.fillStyle = '#2b4450';
  ctx.fill();
  ctx.strokeStyle = pct > 0.5 ? '#6ecbff' : (pct > 0.25 ? '#f4c451' : '#ef5f5f');
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // 城垛
  ctx.fillStyle = '#395a68';
  for (let i = 0; i < 3; i++) {
    rr(ctx, cx - w / 2 + 6 + i * 22, cy - h / 2 - 9, 16, 12, 3);
    ctx.fill();
  }
  // 核心
  const pulse = 1 + Math.sin(s.time * 3.4) * 0.08;
  ctx.beginPath();
  ctx.arc(cx, cy, 17 * pulse, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(110,203,255,.28)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, cy, 10 * pulse, 0, Math.PI * 2);
  ctx.fillStyle = pct > 0.3 ? '#9fe4ff' : '#ffb4b4';
  ctx.fill();
  // 小旗
  ctx.strokeStyle = '#cfe6f0'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx, cy - h / 2 - 9); ctx.lineTo(cx, cy - h / 2 - 30); ctx.stroke();
  ctx.fillStyle = '#6ecbff';
  ctx.beginPath();
  ctx.moveTo(cx, cy - h / 2 - 30);
  ctx.lineTo(cx + 18 + Math.sin(s.time * 5) * 3, cy - h / 2 - 24);
  ctx.lineTo(cx, cy - h / 2 - 17);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawTowerShape(ctx, key, x, y, ang, scale, level) {
  const d = TOWERS[key];
  const u = scale;
  ctx.save();
  ctx.translate(x, y);
  // 底座
  ctx.beginPath();
  ctx.arc(0, 0, 15 * u, 0, Math.PI * 2);
  ctx.fillStyle = '#243a44';
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.35)';
  ctx.lineWidth = 2 * u;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, 0, 12.5 * u, 0, Math.PI * 2);
  ctx.fillStyle = d.dark;
  ctx.fill();

  ctx.rotate(ang);
  if (key === 'arrow') {
    ctx.fillStyle = d.color;
    ctx.beginPath();
    ctx.moveTo(15 * u, 0); ctx.lineTo(-6 * u, 8.5 * u); ctx.lineTo(-2 * u, 0); ctx.lineTo(-6 * u, -8.5 * u);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#d9fff0';
    ctx.beginPath(); ctx.arc(3 * u, 0, 2.6 * u, 0, 6.3); ctx.fill();
  } else if (key === 'cannon') {
    ctx.fillStyle = d.color;
    rr(ctx, -6 * u, -5.5 * u, 22 * u, 11 * u, 4 * u);
    ctx.fill();
    ctx.fillStyle = '#ffd7ae';
    ctx.beginPath(); ctx.arc(16 * u, 0, 3.4 * u, 0, 6.3); ctx.fill();
    ctx.fillStyle = d.dark;
    ctx.beginPath(); ctx.arc(0, 0, 6.5 * u, 0, 6.3); ctx.fill();
  } else if (key === 'frost') {
    ctx.fillStyle = d.color;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3;
      const rr2 = (i % 2 === 0 ? 12 : 7) * u;
      if (i === 0) ctx.moveTo(Math.cos(a) * rr2, Math.sin(a) * rr2);
      else ctx.lineTo(Math.cos(a) * rr2, Math.sin(a) * rr2);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e9fbff';
    ctx.beginPath(); ctx.arc(0, 0, 3.6 * u, 0, 6.3); ctx.fill();
  } else if (key === 'sniper') {
    ctx.fillStyle = d.color;
    rr(ctx, -5 * u, -3.4 * u, 28 * u, 6.8 * u, 3 * u);
    ctx.fill();
    ctx.fillStyle = '#f0e2ff';
    rr(ctx, 10 * u, -1.4 * u, 14 * u, 2.8 * u, 1.4 * u);
    ctx.fill();
    ctx.fillStyle = d.dark;
    ctx.beginPath(); ctx.arc(-1 * u, 0, 7 * u, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#ffd7ff';
    ctx.beginPath(); ctx.arc(-1 * u, 0, 2.6 * u, 0, 6.3); ctx.fill();
  } else if (key === 'tesla') {
    // 磁暴线圈：三节电弧环 + 顶端放电球
    ctx.fillStyle = d.dark;
    ctx.beginPath(); ctx.arc(-2 * u, 0, 7 * u, 0, 6.3); ctx.fill();
    ctx.strokeStyle = d.color;
    ctx.lineWidth = 2.4 * u;
    for (let i = 0; i < 3; i++) {
      const cx2 = (1 + i * 5) * u;
      ctx.beginPath(); ctx.arc(cx2, 0, 4.8 * u, -1.15, 1.15); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx2, 0, 4.8 * u, Math.PI - 1.15, Math.PI + 1.15); ctx.stroke();
    }
    ctx.fillStyle = '#fff8c9';
    ctx.beginPath(); ctx.arc(17.5 * u, 0, 3.4 * u, 0, 6.3); ctx.fill();
    ctx.strokeStyle = 'rgba(240,224,90,.9)';
    ctx.lineWidth = 1.4 * u;
    ctx.beginPath(); ctx.arc(17.5 * u, 0, 5.2 * u, 0, 6.3); ctx.stroke();
  } else if (key === 'venom') {
    // 毒液塔：双管喷雾器 + 发光酸液罐
    ctx.fillStyle = d.dark;
    ctx.beginPath(); ctx.arc(-3 * u, 0, 7.5 * u, 0, 6.3); ctx.fill();
    ctx.fillStyle = d.color;
    rr(ctx, -1 * u, -6 * u, 19 * u, 4.5 * u, 2 * u); ctx.fill();
    rr(ctx, -1 * u, 1.5 * u, 19 * u, 4.5 * u, 2 * u); ctx.fill();
    ctx.fillStyle = '#e4ffb5';
    ctx.beginPath(); ctx.arc(-3 * u, 0, 3.8 * u, 0, 6.3); ctx.fill();
    ctx.fillStyle = d.color;
    ctx.beginPath(); ctx.arc(19 * u, -3.7 * u, 2.2 * u, 0, 6.3); ctx.fill();
    ctx.beginPath(); ctx.arc(19 * u, 3.7 * u, 2.2 * u, 0, 6.3); ctx.fill();
  } else if (key === 'amp') {
    // 增幅塔：环形天线 + 中心能量球
    ctx.fillStyle = d.dark;
    ctx.beginPath(); ctx.arc(-3 * u, 0, 7.5 * u, 0, 6.3); ctx.fill();
    ctx.strokeStyle = d.color;
    ctx.lineWidth = 2.2 * u;
    ctx.beginPath(); ctx.arc(3 * u, 0, 9.5 * u, -1.25, 1.25); ctx.stroke();
    ctx.beginPath(); ctx.arc(3 * u, 0, 9.5 * u, Math.PI - 1.25, Math.PI + 1.25); ctx.stroke();
    ctx.fillStyle = '#e8fffb';
    ctx.beginPath(); ctx.arc(12 * u, 0, 3.4 * u, 0, 6.3); ctx.fill();
    ctx.strokeStyle = 'rgba(125,224,200,.9)';
    ctx.lineWidth = 1.4 * u;
    ctx.beginPath(); ctx.arc(12 * u, 0, 5.4 * u, 0, 6.3); ctx.stroke();
  }
  ctx.restore();

  // 等级点（只画前 5 个，更高等级用数字标注，避免无限升级时点阵溢出）
  const dots = Math.min(level, 5);
  for (let i = 0; i < dots; i++) {
    ctx.beginPath();
    ctx.arc(x - 8 + i * 8, y + 17, 2.6, 0, 6.3);
    ctx.fillStyle = '#ffe9a8';
    ctx.fill();
  }
  if (level > 5) {
    /* 高等级改用右上角数字徽标，点阵不再无限向右蔓延 */
    ctx.font = 'bold 10px "Microsoft YaHei","PingFang SC",system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(10,20,24,.85)';
    ctx.strokeText(String(level), x + 11, y - 13);
    ctx.fillStyle = '#ffe9a8';
    ctx.fillText(String(level), x + 11, y - 13);
  }
}

function drawTowers(ctx, s) {
  // 选中/悬停范围
  const showR = s.sel ? s.sel : null;
  if (showR) {
    const st = towerStats(showR, s);
    ctx.save();
    ctx.beginPath(); ctx.arc(showR.x, showR.y, st.range, 0, 6.3);
    ctx.fillStyle = 'rgba(120,220,255,.10)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(140,230,255,.55)';
    ctx.setLineDash([6, 6]); ctx.lineWidth = 1.5; ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
  for (let i = 0; i < s.towers.length; i++) {
    const t = s.towers[i];
    if (s.sel === t) {
      ctx.save();
      ctx.beginPath(); ctx.arc(t.x, t.y, 20, 0, 6.3);
      ctx.strokeStyle = C.gold; ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();
    }
    const sc = 1 + (t.flash > 0 ? t.flash * 0.5 : 0);
    drawTowerShape(ctx, t.key, t.x, t.y, t.ang, sc, t.level);
  }
}

function drawEnemy(ctx, e) {
  if (!e || e.dead) return; // 阵亡单位不参与渲染，避免结算画面残留尸体
  ctx.save();
  const slow = e.slowT > 0;
  const r = e.r;
  // 影子
  ctx.beginPath();
  ctx.ellipse(e.x, e.y + r * 0.8, r * 0.85, r * 0.4, 0, 0, 6.3);
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  ctx.fill();

  if (slow) {
    ctx.beginPath(); ctx.arc(e.x, e.y, r + 4.5, 0, 6.3);
    ctx.strokeStyle = 'rgba(127,216,255,.85)'; ctx.lineWidth = 2; ctx.stroke();
  }
  if (e.poisonT > 0) {
    ctx.beginPath(); ctx.arc(e.x, e.y, r + 2.5, 0, 6.3);
    ctx.strokeStyle = 'rgba(155,216,79,.8)'; ctx.lineWidth = 1.6; ctx.stroke();
  }
  if (e.shield > 0) {
    ctx.beginPath(); ctx.arc(e.x, e.y, r + 5.5, 0, 6.3);
    ctx.strokeStyle = 'rgba(110,235,255,.72)'; ctx.lineWidth = 2; ctx.stroke();
  }

  ctx.translate(e.x, e.y);
  const body = e.hitT > 0 ? '#ffffff' : e.color;
  if (e.shape === 'tri') {
    ctx.rotate(e.ang);
    ctx.beginPath();
    ctx.moveTo(r * 1.15, 0); ctx.lineTo(-r * 0.8, r * 0.85); ctx.lineTo(-r * 0.8, -r * 0.85);
    ctx.closePath();
    ctx.fillStyle = body; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.30)'; ctx.lineWidth = 1.5; ctx.stroke();
  } else if (e.shape === 'square') {
    ctx.rotate(e.ang * 0.25);
    rr(ctx, -r, -r, r * 2, r * 2, 3);
    ctx.fillStyle = body; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.22)';
    rr(ctx, -r * 0.55, -r * 0.55, r * 1.1, r * 1.1, 2); ctx.fill();
  } else if (e.shape === 'blob') {
    // 分裂虫：两团黏在一起的软体
    ctx.rotate(Math.sin(e.wob) * 0.15);
    ctx.beginPath();
    ctx.arc(-r * 0.38, 0, r * 0.74, 0, 6.3);
    ctx.arc(r * 0.38, 0, r * 0.74, 0, 6.3);
    ctx.fillStyle = body; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.32)'; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.4)';
    ctx.beginPath(); ctx.arc(-r * 0.55, -r * 0.28, r * 0.2, 0, 6.3); ctx.fill();
    ctx.beginPath(); ctx.arc(r * 0.28, -r * 0.28, r * 0.2, 0, 6.3); ctx.fill();
  } else if (e.shape === 'shield') {
    // 护盾兵：六边形装甲 + 中央能量核
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3;
      if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
      else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath(); ctx.fillStyle = body; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, r * 0.45, 0, 6.3);
    ctx.fillStyle = '#c8fbff'; ctx.fill();
  } else if (e.shape === 'medic') {
    // 医疗兵：白袍圆身 + 翠绿十字徽记
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.3);
    ctx.fillStyle = body; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.32)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#38c96a';
    rr(ctx, -r * 0.18, -r * 0.62, r * 0.36, r * 1.24, 2); ctx.fill();
    rr(ctx, -r * 0.62, -r * 0.18, r * 1.24, r * 0.36, 2); ctx.fill();
  } else if (e.shape === 'berserker') {
    // 狂怒兽：锯齿星形，血量越低张得越开
    const rage = 1 + (e.rage || 0) * (1 - clamp(e.hp / e.maxHp, 0, 1));
    ctx.rotate(e.ang);
    ctx.beginPath();
    for (let i = 0; i < 7; i++) {
      const a = i * Math.PI * 2 / 7;
      const rad = (i % 2 === 0 ? r * 1.15 : r * 0.62) * rage;
      if (i === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
      else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
    }
    ctx.closePath();
    ctx.fillStyle = body; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, r * 0.34, 0, 6.3);
    ctx.fillStyle = '#ffe3f2'; ctx.fill();
  } else if (e.shape === 'swarm') {
    // 蜂群：三只小虫叠成蜂巢
    ctx.beginPath();
    ctx.arc(-r * 0.6, 0, r * 0.62, 0, 6.3);
    ctx.arc(r * 0.6, 0, r * 0.62, 0, 6.3);
    ctx.arc(0, -r * 0.66, r * 0.62, 0, 6.3);
    ctx.fillStyle = body; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 1.4; ctx.stroke();
  } else if (e.shape === 'boss') {
    const p = 1 + Math.sin(e.wob) * 0.06;
    ctx.rotate(e.wob * 0.4);
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = i * Math.PI / 5;
      const rad = (i % 2 === 0 ? r * 1.25 : r * 0.82) * p;
      if (i === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
      else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
    }
    ctx.closePath();
    ctx.fillStyle = body; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.rotate(-e.wob * 0.4);
    ctx.beginPath(); ctx.arc(0, 0, r * 0.42, 0, 6.3);
    ctx.fillStyle = '#ffe3f4'; ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.3);
    ctx.fillStyle = body; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.32)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(-r * 0.25, -r * 0.2, r * 0.3, 0, 6.3);
    ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fill();
  }
  ctx.restore();

  // 血条
  const pct = clamp(e.hp / e.maxHp, 0, 1);
  const bw = Math.max(24, e.r * 2.4), bh = 4;
  const bx = e.x - bw / 2, by = e.y - e.r - 11;
  ctx.fillStyle = 'rgba(0,0,0,.55)';
  rr(ctx, bx - 1, by - 1, bw + 2, bh + 2, 2.5); ctx.fill();
  ctx.fillStyle = pct > 0.55 ? '#5ed67f' : (pct > 0.25 ? '#f4c451' : '#ef5f5f');
  rr(ctx, bx, by, bw * pct, bh, 2); ctx.fill();
  if (e.maxShield > 0) {
    const sy = by - 6;
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    rr(ctx, bx - 1, sy - 1, bw + 2, 4, 2); ctx.fill();
    ctx.fillStyle = '#68dce8';
    rr(ctx, bx, sy, bw * clamp(e.shield / e.maxShield, 0, 1), 2, 1); ctx.fill();
  }
}

function drawShots(ctx, s) {
  for (let i = 0; i < s.shots.length; i++) {
    const sh = s.shots[i];
    if (sh.kind === 'homing') {
      ctx.save();
      ctx.translate(sh.x, sh.y);
      ctx.rotate(sh.ang || 0);
      ctx.fillStyle = sh.color;
      ctx.beginPath();
      ctx.moveTo(7, 0); ctx.lineTo(-5, 3); ctx.lineTo(-5, -3);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    } else if (sh.kind === 'shell') {
      const k = clamp(sh.t / sh.dur, 0, 1);
      const arc = Math.sin(k * Math.PI) * 26;
      ctx.save();
      ctx.beginPath();
      ctx.arc(sh.x, sh.y - arc, 5, 0, 6.3);
      ctx.fillStyle = '#2b2b2b'; ctx.fill();
      ctx.strokeStyle = sh.color; ctx.lineWidth = 1.6; ctx.stroke();
      ctx.beginPath();
      ctx.arc(sh.x, sh.y - arc, 2, 0, 6.3);
      ctx.fillStyle = '#ffd7ae'; ctx.fill();
      ctx.restore();
    } else if (sh.kind === 'frost') {
      ctx.save();
      ctx.beginPath();
      ctx.arc(sh.x, sh.y, 4.5, 0, 6.3);
      ctx.fillStyle = '#eafbff'; ctx.fill();
      ctx.strokeStyle = sh.color; ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();
    }
  }
}

function drawEffects(ctx, s) {
  for (let i = 0; i < s.effects.length; i++) {
    const fx = s.effects[i];
    const k = clamp(fx.t / fx.life, 0, 1);
    ctx.save();
    if (fx.kind === 'ring') {
      const r = fx.r0 + (fx.r1 - fx.r0) * k;
      ctx.beginPath(); ctx.arc(fx.x, fx.y, Math.max(0.5, r), 0, 6.3);
      ctx.strokeStyle = fx.color;
      ctx.globalAlpha = 1 - k;
      ctx.lineWidth = 3 * (1 - k) + 1;
      ctx.stroke();
    } else if (fx.kind === 'boom') {
      ctx.globalAlpha = 1 - k;
      const g = ctx.createRadialGradient(fx.x, fx.y, 2, fx.x, fx.y, fx.r * (0.6 + k * 0.8));
      g.addColorStop(0, 'rgba(255,240,190,.95)');
      g.addColorStop(0.45, 'rgba(255,160,70,.72)');
      g.addColorStop(1, 'rgba(255,120,60,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(fx.x, fx.y, fx.r * (0.6 + k * 0.8), 0, 6.3); ctx.fill();
      ctx.beginPath(); ctx.arc(fx.x, fx.y, fx.r * (0.6 + k * 0.9), 0, 6.3);
      ctx.strokeStyle = 'rgba(255,220,160,' + (0.8 * (1 - k)) + ')';
      ctx.lineWidth = 2.5; ctx.stroke();
    } else if (fx.kind === 'spark') {
      ctx.globalAlpha = 1 - k;
      ctx.strokeStyle = fx.color;
      ctx.lineWidth = 2;
      for (let a = 0; a < 4; a++) {
        const ang = a * Math.PI / 2 + 0.4;
        const r0 = 2 + k * 6, r1 = 8 + k * 10;
        ctx.beginPath();
        ctx.moveTo(fx.x + Math.cos(ang) * r0, fx.y + Math.sin(ang) * r0);
        ctx.lineTo(fx.x + Math.cos(ang) * r1, fx.y + Math.sin(ang) * r1);
        ctx.stroke();
      }
    } else if (fx.kind === 'pop') {
      ctx.globalAlpha = 1 - k;
      ctx.beginPath(); ctx.arc(fx.x, fx.y, fx.r * (1 + k * 1.4), 0, 6.3);
      ctx.strokeStyle = fx.color; ctx.lineWidth = 3; ctx.stroke();
    } else if (fx.kind === 'beam') {
      ctx.globalAlpha = 1 - k;
      ctx.strokeStyle = fx.color;
      ctx.lineWidth = 3.5 * (1 - k) + 1;
      ctx.beginPath(); ctx.moveTo(fx.x1, fx.y1); ctx.lineTo(fx.x2, fx.y2); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,.9)';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(fx.x1, fx.y1); ctx.lineTo(fx.x2, fx.y2); ctx.stroke();
    }
    ctx.restore();
  }
  for (let i = 0; i < s.floats.length; i++) {
    const f = s.floats[i];
    const k = clamp(f.t / f.life, 0, 1);
    ctx.save();
    ctx.globalAlpha = 1 - k * k;
    txt(ctx, f.text, f.x, f.y, 14, f.color, 'center', 700);
    ctx.restore();
  }
}

/* ---------------- UI 布局（渲染与点击共用同一份几何） ---------------- */
const CARD_H = 78, CARD_GAP = 6;
const WAVE_X = 776, WAVE_W = 214, SEL_W = 248;
function uiRects(s) {
  /* 卡片宽度随塔种数量自适应：卡片区 + 选中面板 + 波次面板必须各自留得下，互不重叠 */
  const n = TOWER_KEYS.length;
  const left = 10;
  const cardsRight = WAVE_X - 8 - SEL_W - 10;
  const avail = Math.max(60, cardsRight - left);
  const cardW = clamp(Math.floor((avail - CARD_GAP * (n - 1)) / n), 56, 78);
  const cards = [];
  for (let i = 0; i < n; i++) {
    cards.push({ x: left + i * (cardW + CARD_GAP), y: BAR_Y + 11, w: cardW, h: CARD_H, key: TOWER_KEYS[i] });
  }
  const px = left + n * (cardW + CARD_GAP) + 8;
  return {
    cards: cards,
    panel: { x: px, y: BAR_Y + 8, w: WAVE_X - 8 - px, h: 84 },
    wave: { x: WAVE_X, y: BAR_Y + 8, w: WAVE_W, h: 84 },
    upBtn: { x: px + 132, y: BAR_Y + 52, w: 104, h: 30 },
    sellBtn: { x: px + 10, y: BAR_Y + 52, w: 104, h: 30 },
    speed: { x: 818, y: 12, w: 58, h: 34 },
    pause: { x: 882, y: 12, w: 58, h: 34 },
    mute: { x: 946, y: 12, w: 44, h: 34 },
    auto: { x: 328, y: 15, w: 40, h: 27 },
    autoMode: { x: 372, y: 15, w: 42, h: 27 }
  };
}
function menuRects() {

function inRect(r, x, y) { return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }

/* ---------------- HUD ---------------- */
function drawHUD(ctx, s) {
  const R = uiRects(s);
  ctx.save();
  const g = ctx.createLinearGradient(0, 0, 0, HUD_H);
  g.addColorStop(0, '#1b2f39');
  g.addColorStop(1, '#152730');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, HUD_H);
  ctx.strokeStyle = '#2b4553';
  ctx.beginPath(); ctx.moveTo(0, HUD_H - .5); ctx.lineTo(W, HUD_H - .5); ctx.stroke();

  // 生命
  ctx.beginPath(); ctx.arc(30, 30, 10, 0, 6.3);
  ctx.fillStyle = 'rgba(239,112,112,.18)'; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(30, 36); ctx.bezierCurveTo(20, 28, 22, 21, 30, 26);
  ctx.bezierCurveTo(38, 21, 40, 28, 30, 36);
  ctx.fillStyle = C.life; ctx.fill();
  txt(ctx, s.lives + ' / ' + s.maxLives, 48, 30, 16, C.ink, 'left', 700);
  txt(ctx, '生命', 48, 45, 10, C.faint, 'left', 500);

  // 金币
  ctx.beginPath(); ctx.arc(166, 30, 9, 0, 6.3);
  ctx.fillStyle = C.gold; ctx.fill();
  ctx.beginPath(); ctx.arc(166, 30, 5, 0, 6.3);
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fill();
  txt(ctx, '' + s.gold, 182, 30, 16, C.ink, 'left', 700);
  txt(ctx, '金币', 182, 45, 10, C.faint, 'left', 500);

  // 得分
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + i * Math.PI * 2 / 5;
    const b = a + Math.PI / 5;
    const r1 = 9, r2 = 4;
    if (i === 0) ctx.moveTo(258 + Math.cos(a) * r1, 30 + Math.sin(a) * r1);
    else ctx.lineTo(258 + Math.cos(a) * r1, 30 + Math.sin(a) * r1);
    ctx.lineTo(258 + Math.cos(b) * r2, 30 + Math.sin(b) * r2);
  }
  ctx.closePath();
  ctx.fillStyle = C.score; ctx.fill();
  txt(ctx, '' + s.score, 274, 30, 16, C.ink, 'left', 700);
  txt(ctx, '得分', 274, 45, 10, C.faint, 'left', 500);

  // 波次
  const total = totalWaves(s.mode);
  const waveNum = s.wave + (s.phase === 'prep' ? 1 : 0);
  const waveTxt = s.mode === 'endless'
    ? '第 ' + waveNum + ' 波 · ∞'
    : '第 ' + Math.min(waveNum, total) + ' / ' + total + ' 波';
  txt(ctx, waveTxt, 420, 22, 14, C.ink, 'left', 700);
  const prog = s.wave === 0 ? 0 : Math.min(1, s.wave / total);
  const bw = 240;
  rr(ctx, 420, 34, bw, 8, 4);
  ctx.fillStyle = '#0f1d24'; ctx.fill();
  if (prog > 0) {
    rr(ctx, 420, 34, Math.max(3, bw * prog), 8, 4);
    ctx.fillStyle = '#5ec8f0'; ctx.fill();
  }
  txt(ctx, s.phase === 'prep' ? ('下一波 ' + Math.ceil(s.prepLeft) + 's') : '交战中',
    420 + bw + 10, 38, 12, s.phase === 'prep' ? C.dim : '#f4c451', 'left', 600);

  // 自动存档提示
  if (s.saveFlash > 0) {
    ctx.globalAlpha = Math.min(1, s.saveFlash);
    txt(ctx, '已存档 ✓', 756, 30, 12, '#7dffa8', 'left', 700);
    ctx.globalAlpha = 1;
  }

  // 按钮
  function btn(r, label, active) {
    rr(ctx, r.x, r.y, r.w, r.h, 8);
    ctx.fillStyle = active ? '#2f6b82' : '#223a46';
    ctx.fill();
    ctx.strokeStyle = active ? '#5ec8f0' : '#31505f';
    ctx.lineWidth = 1.2; ctx.stroke();
    txt(ctx, label, r.x + r.w / 2, r.y + r.h / 2, 13, C.ink, 'center', 700);
  }
  /* 自动升级：开关 + 升级顺序（智能 / 左→右 / 右→左 / 扩散） */
  function miniBtn(r, label, active, hot) {
    rr(ctx, r.x, r.y, r.w, r.h, 7);
    ctx.fillStyle = active ? '#2f6b4a' : (hot ? '#20414f' : '#1b2f39');
    ctx.fill();
    ctx.strokeStyle = active ? '#7dffa8' : (hot ? '#6ecbff' : '#31505f');
    ctx.lineWidth = 1.2; ctx.stroke();
    txt(ctx, label, r.x + r.w / 2, r.y + r.h / 2, 11.5, active ? '#eafff2' : C.dim, 'center', 700);
  }
  miniBtn(R.auto, s.autoUp ? '自动开' : '自动', !!s.autoUp, s.autoHover === 'auto');
  miniBtn(R.autoMode, autoModeLabel(s.autoMode), s.autoMode !== 'smart', s.autoHover === 'autoMode');
  btn(R.speed, s.speed + '×', s.speed > 1);
  btn(R.pause, s.paused ? '继续' : '暂停', s.paused);
  btn(R.mute, muted ? '静音' : '音效', false);
  ctx.restore();
}

/* ---------------- 底部栏 ---------------- */
function drawBar(ctx, s) {
  const R = uiRects(s);
  ctx.save();
  ctx.fillStyle = C.panel;
  ctx.fillRect(0, BAR_Y, W, BAR_H);
  ctx.strokeStyle = '#2b4553';
  ctx.beginPath(); ctx.moveTo(0, BAR_Y + .5); ctx.lineTo(W, BAR_Y + .5); ctx.stroke();

  // 塔卡片
  for (let i = 0; i < R.cards.length; i++) {
    const r = R.cards[i], key = r.key, d = TOWERS[key];
    const afford = s.gold >= d.cost;
    const active = s.pick === key;
    const narrow = r.w < 72; // 卡片变窄时改用竖排排版，避免文字挤出格子
    rr(ctx, r.x, r.y, r.w, r.h, 10);
    ctx.fillStyle = active ? '#20414f' : (afford ? C.panel2 : '#182830');
    ctx.fill();
    ctx.strokeStyle = active ? d.color : (afford ? C.edge : '#243843');
    ctx.lineWidth = active ? 2 : 1.2;
    ctx.stroke();

    ctx.save();
    ctx.globalAlpha = afford ? 1 : 0.45;
    drawTowerShape(ctx, key, narrow ? r.x + r.w / 2 : r.x + 17, r.y + 25, -Math.PI / 2, narrow ? 0.55 : 0.65, 0);

    if (narrow) {
      txt(ctx, d.name, r.x + r.w / 2, r.y + 46, 11, afford ? C.ink : C.faint, 'center', 700);
      txt(ctx, d.cost + ' 金', r.x + r.w / 2, r.y + 62, 11, afford ? C.gold : '#7a6a45', 'center', 700);
      txt(ctx, '[' + (i + 1) + ']', r.x + r.w - 7, r.y + 13, 10, C.faint, 'right', 500);
    } else {
      txt(ctx, d.name, r.x + 31, r.y + 19, 12, afford ? C.ink : C.faint, 'left', 700);
      txt(ctx, d.role, r.x + 31, r.y + 35, 10, C.faint, 'left', 500);
      txt(ctx, d.cost + ' 金', r.x + 8, r.y + 62, 12, afford ? C.gold : '#7a6a45', 'left', 700);
      txt(ctx, '[' + (i + 1) + ']', r.x + r.w - 10, r.y + 62, 11, C.faint, 'right', 500);
    }
  }

  // 选中塔信息
  const p = R.panel;
  rr(ctx, p.x, p.y, p.w, p.h, 10);
  ctx.fillStyle = C.panel2; ctx.fill();
  ctx.strokeStyle = C.edge; ctx.lineWidth = 1.2; ctx.stroke();

  const t = s.sel;
  if (t) {
    const d = TOWERS[t.key], st = towerStats(t, s);
    txt(ctx, d.name + '  Lv.' + t.level, p.x + 12, p.y + 18, 14, d.color, 'left', 700);
    if (st.amp > 0) txt(ctx, '增幅 +' + Math.round(st.amp * 100) + '%', p.x + p.w - 12, p.y + 18, 11, '#7de0c8', 'right', 700);
    if (st.rate > 0) {
      txt(ctx, '伤害 ' + Math.round(st.dmg) + '   射程 ' + Math.round(st.range) + '   射速 ' + st.rate.toFixed(2) + '/s',
        p.x + 12, p.y + 38, 11, C.dim, 'left', 500, p.w - 24);
    } else {
      const amv = Math.round((d.ampMul || 0) * (1 + (t.level - 1) * 0.25) * 100);
      txt(ctx, '支援型 · 光环 ' + Math.round(st.range) + '   友军射速 +' + amv + '%',
        p.x + 12, p.y + 38, 11, C.dim, 'left', 500, p.w - 24);
    }

    // 升级按钮（无等级上限，金币够就能一直升）
    const ub = R.upBtn;
    const cost = upgradeCost(t);
    const canUp = Number.isFinite(cost) && s.gold >= cost;
    rr(ctx, ub.x, ub.y, ub.w, ub.h, 8);
    ctx.fillStyle = canUp ? '#2f6b4a' : '#22333a';
    ctx.fill();
    ctx.strokeStyle = canUp ? '#57d68a' : '#33474f';
    ctx.stroke();
    txt(ctx, '升级 ' + cost, ub.x + ub.w / 2, ub.y + ub.h / 2, 12.5,
      canUp ? '#d9ffe9' : C.faint, 'center', 700, ub.w - 10);

    // 出售按钮
    const sb = R.sellBtn;
    rr(ctx, sb.x, sb.y, sb.w, sb.h, 8);
    ctx.fillStyle = '#33262a';
    ctx.fill();
    ctx.strokeStyle = '#5c3a41';
    ctx.stroke();
    txt(ctx, '出售 +' + sellValue(t), sb.x + sb.w / 2, sb.y + sb.h / 2, 12.5, '#f0b8b8', 'center', 700, sb.w - 10);
  } else {
    txt(ctx, '未选中防御塔', p.x + 12, p.y + 20, 13, C.dim, 'left', 700);
    txt(ctx, '点击场上已建造的塔即可查看', p.x + 12, p.y + 40, 11, C.faint, 'left', 500);
    txt(ctx, '数值并升级或出售', p.x + 12, p.y + 57, 11, C.faint, 'left', 500);
  }

  // 波次面板
  const wv = R.wave;
  rr(ctx, wv.x, wv.y, wv.w, wv.h, 10);
  ctx.fillStyle = C.panel2; ctx.fill();

  if (s.phase === 'prep') {

    txt(ctx, Math.ceil(s.prepLeft) + ' 秒后敌军来袭', wv.x + 12, wv.y + 38, 11.5, C.dim, 'left', 500);
    const nextIdx = s.wave;
    const total = totalWaves(s.mode);
    txt(ctx, (s.mode === 'endless' || nextIdx < total) ? '下一波：' + waveSummary(nextIdx, s.mode) : '', wv.x + 12, wv.y + 53, 10, C.faint, 'left', 500, wv.w - 24);
    // 呼叫按钮
    const bx = wv.x + 12, by = wv.y + 64, bw2 = wv.w - 24, bh2 = 18;
    rr(ctx, bx, by, bw2, bh2, 6);
    ctx.fillStyle = '#3d5a2c'; ctx.fill();
    ctx.strokeStyle = '#7fb356'; ctx.stroke();
    txt(ctx, '立即召唤 +' + Math.floor(s.prepLeft * 2.5) + ' 金', bx + bw2 / 2, by + bh2 / 2 + .5, 11, '#e2ffc9', 'center', 700);
  } else {
    txt(ctx, '第 ' + s.wave + ' 波 交战中', wv.x + 12, wv.y + 20, 13, '#f4c451', 'left', 700);
    txt(ctx, '剩余敌人 ' + s.enemies.length, wv.x + 12, wv.y + 42, 11.5, C.dim, 'left', 500);
    txt(ctx, '待出场 ' + s.spawnQueue.length, wv.x + 12, wv.y + 60, 11, C.faint, 'left', 500);
  }
  ctx.restore();
}

/* ---------------- 建造预览 ---------------- */
function drawPreview(ctx, s) {
  if (!s.pick) return;
  const c = s.hover.c, r = s.hover.r;
  if (c < 0 || r < 0) return;
  const d = TOWERS[s.pick];
  const free = cellFree(s, c, r);
  const canAfford = s.gold >= d.cost;
  const x = c * CELL, y = FIELD_Y + r * CELL;
  ctx.save();
  ctx.fillStyle = free && canAfford ? 'rgba(87,214,138,.28)' : 'rgba(239,95,95,.28)';
  rr(ctx, x + 2, y + 2, CELL - 4, CELL - 4, 8);
  ctx.fill();
  ctx.strokeStyle = free && canAfford ? 'rgba(87,214,138,.9)' : 'rgba(239,95,95,.9)';
  ctx.setLineDash([5, 4]);
  ctx.lineWidth = 1.6; ctx.stroke();
  ctx.setLineDash([]);
  if (free) {
    ctx.beginPath();
    ctx.arc(cellCX(c), cellCY(r), d.range, 0, 6.3);
    ctx.fillStyle = 'rgba(120,220,255,.08)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(140,230,255,.42)';
    ctx.stroke();
  }
  ctx.globalAlpha = 0.45;
  drawTowerShape(ctx, s.pick, cellCX(c), cellCY(r), -Math.PI / 2, 1, 0);
  ctx.restore();
}

/* ---------------- 主渲染 ---------------- */
/* 视口留白处理：
   ① 左右留白（宽屏）——草地棋盘格向外延伸、网格对齐，栏位横贯整窗，画面连成一整片；
   ② 上下留白（竖屏）——场地居中作卡片，外围是带柔光的舞台底色。
   两种情况下都不会露出纯黑的边条。 */
function drawFrame(ctx, s) {
  const vw = view.vw, vh = view.vh;
  const k = view.k || 1;
  const cs = CELL * k;
  const sideBar = view.ox > 1;

  /* 竖向留白：舞台底色 + 中心柔光，衬托居中的场地卡片 */
  if (!sideBar) {
    const g = ctx.createLinearGradient(0, 0, 0, vh);
    g.addColorStop(0, '#172a31');
    g.addColorStop(0.5, '#101d23');
    g.addColorStop(1, '#0a141a');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, vw, vh);
    const rg = ctx.createRadialGradient(vw / 2, vh * 0.46, 0, vw / 2, vh * 0.46, Math.max(vw, vh) * 0.62);
    rg.addColorStop(0, 'rgba(100,172,144,.16)');
    rg.addColorStop(0.55, 'rgba(52,112,112,.06)');
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, vw, vh);

    /* 全屏遮罩同样盖住上下留白 */
    if (s) {
      let veil = null;
      if (s.scene === 'menu') veil = 'rgba(8,15,19,.88)';
      else if (s.scene === 'win' || s.scene === 'lose') veil = 'rgba(6,12,16,.82)';
      else if (s.paused) veil = 'rgba(6,12,16,.72)';
      if (veil) {
        ctx.fillStyle = veil;
        ctx.fillRect(0, 0, vw, vh);
      }
    }
    return;
  }

  /* 横向留白：先是与场内同色的草地，再按同一相位把棋盘格铺出去 */
  ctx.fillStyle = C.bgA;
  ctx.fillRect(0, 0, vw, vh);
  if (cs > 4) {
    const c0 = Math.floor(-view.ox / cs) - 1;
    const c1 = Math.ceil((vw - view.ox) / cs) + 1;
    for (let r = 0; r < ROWS; r++) {
      const y = view.oy + (FIELD_Y + r * CELL) * k;
      for (let c = c0; c < c1; c++) {
        ctx.fillStyle = ((((r + c) % 2) + 2) % 2 === 0) ? C.bgA : C.bgB;
        ctx.fillRect(view.ox + c * cs, y, cs + 1, cs + 1);
      }
    }
  }

  /* 网格线继续向场地外延伸，与场内同相位 */
  if (cs > 6) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, vw, vh);
    ctx.rect(view.ox, view.oy, W * k, H * k); // 挖掉场地本身，只画外圈
    ctx.clip('evenodd');
    ctx.strokeStyle = 'rgba(20,44,28,.18)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = view.ox % cs; x < vw; x += cs) { ctx.moveTo(Math.round(x) + .5, 0); ctx.lineTo(Math.round(x) + .5, vh); }
    for (let y = view.oy % cs; y < vh; y += cs) { ctx.moveTo(0, Math.round(y) + .5); ctx.lineTo(vw, Math.round(y) + .5); }
    ctx.stroke();
    ctx.restore();
  }

  /* 越靠近窗口边缘越暗：留白自然收进暗部，而不是一条硬边 */
  const lg = ctx.createLinearGradient(0, 0, view.ox, 0);
  lg.addColorStop(0, 'rgba(8,20,14,.62)');
  lg.addColorStop(1, 'rgba(8,20,14,0)');
  ctx.fillStyle = lg;
  ctx.fillRect(0, 0, view.ox, vh);
  const rg2 = ctx.createLinearGradient(vw - view.ox, 0, vw, 0);
  rg2.addColorStop(0, 'rgba(8,20,14,0)');
  rg2.addColorStop(1, 'rgba(8,20,14,.62)');
  ctx.fillStyle = rg2;
  ctx.fillRect(vw - view.ox, 0, view.ox, vh);

  /* 顶部 HUD 与底部操作栏横贯整个窗口，结构不断裂（菜单没有栏位，不延伸） */
  if (!s || s.scene !== 'menu') {
  const hg = ctx.createLinearGradient(0, view.oy, 0, view.oy + HUD_H * k);
  hg.addColorStop(0, '#1b2f39');
  hg.addColorStop(1, '#152730');
  ctx.fillStyle = hg;
  ctx.fillRect(0, view.oy, vw, HUD_H * k);
  ctx.fillStyle = C.panel;
  ctx.fillRect(0, view.oy + BAR_Y * k, vw, BAR_H * k + 1);
  ctx.strokeStyle = '#2b4553';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, Math.round(view.oy + HUD_H * k) - .5);
  ctx.lineTo(vw, Math.round(view.oy + HUD_H * k) - .5);
  ctx.moveTo(0, Math.round(view.oy + BAR_Y * k) + .5);
  ctx.lineTo(vw, Math.round(view.oy + BAR_Y * k) + .5);
  ctx.stroke();
  }

  /* 菜单 / 结算 / 暂停这类全屏遮罩，也在留白区铺一层，
     否则宽屏下会看到一个「暗盒」边框 */
  if (s) {
    let veil = null;
    if (s.scene === 'menu') veil = 'rgba(8,15,19,.88)';
    else if (s.scene === 'win' || s.scene === 'lose') veil = 'rgba(6,12,16,.82)';
    else if (s.paused) veil = 'rgba(6,12,16,.72)';
    if (veil) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, vw, vh);
      ctx.rect(view.ox, view.oy, W * k, H * k);
      ctx.clip('evenodd');
      ctx.fillStyle = veil;
      ctx.fillRect(0, 0, vw, vh);
      ctx.restore();
    }
  }
}

function draw(s, ctx) {
  ctx.save();
  drawFrame(ctx, s);
  ctx.save();
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.k, view.k);
  /* 横向留白时场地与外围已连成一整片，不再画卡片投影与圆角；
     满幅时保留圆角 + 投影的卡片质感 */
  const framed = view.ox <= 1 && view.oy <= 1;
  const radius = framed ? 14 / view.k : 0;
  ctx.save();
  rr(ctx, 0, 0, W, H, radius);
  if (framed) {
    ctx.shadowColor = 'rgba(0,0,0,.72)';
    ctx.shadowBlur = 46 / view.k;
    ctx.shadowOffsetY = 16 / view.k;
  }
  ctx.fillStyle = '#122024';
  ctx.fill();
  ctx.restore();

  ctx.save();
  rr(ctx, 0, 0, W, H, radius);
  ctx.clip();
  ctx.clearRect(0, 0, W, H);

  if (s.scene === 'menu') {
    drawField(ctx);
    drawPath(ctx, s);
    drawBase(ctx, s);
    drawMenu(ctx, s);
    drawToast(ctx);
    ctx.restore();
    ctx.restore();
    return;
  }

  ctx.save();
  if (s.shake > 0) {
    ctx.translate((Math.random() - 0.5) * s.shake, (Math.random() - 0.5) * s.shake);
  }
  drawField(ctx);
  drawPath(ctx, s);
  drawPreview(ctx, s);
  drawBase(ctx, s);
  drawAutoOrigin(ctx, s);
  drawTowers(ctx, s);
  for (let i = 0; i < s.enemies.length; i++) drawEnemy(ctx, s.enemies[i]);
  drawShots(ctx, s);
  drawEffects(ctx, s);
  drawBanner(ctx, s);
  ctx.restore();

  drawHUD(ctx, s);
  drawBar(ctx, s);

  if (s.hint > 0 && s.scene === 'play' && !s.paused) {
    ctx.save();
    ctx.globalAlpha = clamp(s.hint, 0, 1) * 0.9;
    txt(ctx, '点击卡片选塔 → 点草地建造 → 点塔可升级', W / 2, FIELD_Y + FIELD_H - 26, 13, '#dff1f8', 'center', 600);
    ctx.restore();
  }
  if (s.paused && s.scene === 'play') drawPause(ctx, s);
  if (s.scene === 'win') drawOver(ctx, s, true);
  if (s.scene === 'lose') drawOver(ctx, s, false);
  drawToast(ctx);

  ctx.restore();
  ctx.restore();
}

/* =========================================================
   交互 + 启动
   ========================================================= */
function hitTowerAt(s, x, y) {
  for (let i = s.towers.length - 1; i >= 0; i--) {
    const t = s.towers[i];
    if (dist2(t.x, t.y, x, y) <= 19 * 19) return t;
  }
  return null;
}
function cellFromPoint(x, y) {
  if (y < FIELD_Y || y >= BAR_Y) return { c: -1, r: -1 };
  return { c: Math.floor(x / CELL), r: Math.floor((y - FIELD_Y) / CELL) };
}

/* ---------------- 导出 / 导入 弹窗（DOM 覆盖层） ----------------
   用真实 DOM 而不是画布绘制：文本框天然支持粘贴、选区、输入法与移动端键盘。 */
let modalRoot = null, modalText = null, modalMsg = null, modalBtns = null, modalTitle = null, modalDesc = null;

function ensureModal() {
  if (modalRoot) return modalRoot;
  if (typeof document === 'undefined' || !document.body) return null;
  modalRoot = document.createElement('div');
  modalRoot.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;display:none;' +
    'align-items:center;justify-content:center;background:rgba(4,10,14,.82);' +
    'font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;';
  const card = document.createElement('div');
  card.style.cssText = 'width:min(720px,92vw);max-height:88vh;overflow:auto;box-sizing:border-box;' +
    'background:#16262f;border:1px solid #2f4c5a;border-radius:14px;padding:20px 22px 18px;' +
    'box-shadow:0 24px 70px rgba(0,0,0,.72);color:#eaf7ff;';
  modalTitle = document.createElement('div');
  modalTitle.id = 'td-modal-title';
  modalTitle.style.cssText = 'font-size:19px;font-weight:700;letter-spacing:1px;';
  modalDesc = document.createElement('div');
  modalDesc.id = 'td-modal-desc';
  modalDesc.style.cssText = 'font-size:12.5px;color:#8aa6b4;margin-top:8px;line-height:1.8;';
  modalText = document.createElement('textarea');
  modalText.id = 'td-modal-text';
  modalText.style.cssText = 'width:100%;height:180px;box-sizing:border-box;margin-top:14px;resize:vertical;' +
    'background:#0f1b22;border:1px solid #2f4c5a;border-radius:10px;color:#cfeaf7;' +
    'font-family:Consolas,Monaco,"Courier New",monospace;font-size:12px;line-height:1.6;padding:10px 12px;';
  modalMsg = document.createElement('div');
  modalMsg.id = 'td-modal-msg';
  modalMsg.style.cssText = 'font-size:12.5px;color:#ef5f5f;min-height:18px;margin-top:10px;';
  modalBtns = document.createElement('div');
  modalBtns.id = 'td-modal-btns';
  modalBtns.style.cssText = 'display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;';
  card.appendChild(modalTitle);
  card.appendChild(modalDesc);
  card.appendChild(modalText);
  card.appendChild(modalMsg);
  card.appendChild(modalBtns);
  modalRoot.appendChild(card);
  document.body.appendChild(modalRoot);
  /* 点遮罩空白处关闭 */
  modalRoot.addEventListener('pointerdown', function (ev) {
    if (ev.target === modalRoot) closeModal();
  });
  return modalRoot;
}
function modalButton(label, primary, onClick) {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = label;
  b.style.cssText = 'padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;border-radius:9px;' +
    'border:1px solid ' + (primary ? '#6ecbff' : '#2f4c5a') + ';' +
    'background:' + (primary ? '#20414f' : '#1a2c35') + ';' +
    'color:' + (primary ? '#eaf7ff' : '#9fb6c2') + ';';
  b.addEventListener('click', onClick);
  modalBtns.appendChild(b);
  return b;
}
function setModalMsg(text, color) {
  if (!modalMsg) return;
  modalMsg.textContent = text;
  modalMsg.style.color = color || '#8aa6b4';
}
function modalOpen() { return !!(modalRoot && modalRoot.style.display === 'flex'); }
function closeModal() {
  if (modalRoot) modalRoot.style.display = 'none';
}
/* 复制：优先用剪贴板 API，被浏览器拒绝时退回 execCommand */
function copyToClipboard(text) {
  try {
    if (typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText) {
      const p = navigator.clipboard.writeText(text);
      if (p && p.then) {
        p.then(function () { setModalMsg('已复制到剪贴板 ✓', '#57d68a'); },
          function () { fallbackCopy(text); });
        return true;
      }
    }
  } catch (e) { /* 落到下面的降级方案 */ }
  return fallbackCopy(text);
}
function fallbackCopy(text) {
  try {
    if (!modalText) return false;
    modalText.focus();
    modalText.select();
    const ok = document.execCommand('copy');
    setModalMsg(ok ? '已复制到剪贴板 ✓' : '复制失败，请手动全选上面的文字复制', ok ? '#57d68a' : '#ef5f5f');
    return ok;
  } catch (e) { return false; }
}
function downloadSaveFile(code, snap) {
  if (typeof document === 'undefined' || typeof Blob === 'undefined') return;
  try {
    const blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = saveCodeFilename(snap);
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      if (a.parentNode) a.parentNode.removeChild(a);
      URL.revokeObjectURL(url);
    }, 800);
    setModalMsg('已导出文件：' + a.download, '#57d68a');
  } catch (e) {
    setModalMsg('导出文件失败，请改用「复制存档码」', '#ef5f5f');
  }
}
function pickSaveFile() {
  if (typeof document === 'undefined') return;
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.txt,.tdsave,text/plain';
  inp.style.display = 'none';
  inp.addEventListener('change', function () {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const fr = new FileReader();
    fr.onload = function () {
      modalText.value = String(fr.result || '');
      setModalMsg('已读取 ' + f.name + '，点「导入并续战」应用', '#8aa6b4');
    };
    fr.onerror = function () { setModalMsg('文件读取失败', '#ef5f5f'); };
    fr.readAsText(f);
  });
  document.body.appendChild(inp);
  inp.click();
  setTimeout(function () { if (inp.parentNode) inp.parentNode.removeChild(inp); }, 0);
}
function openExportModal(code, snap) {

    '在另一台设备上用「导入存档」粘贴即可接着打。<br>' +
    '关卡：' + DIFF[snap.mode].label + ' · 第 ' + snap.wave + ' 波 · 生命 ' + snap.lives + ' · 金币 ' + snap.gold +
    ' · 防御塔 ' + snap.towers.length + ' 座';

  modalText.focus();

}
function openImportModal() {
  if (!ensureModal()) return;

  modalText.style.display = '';

function doImportFromModal() {

}
/* 切换升级顺序：智能 → 左→右 → 右→左 → 扩散 → 智能 */
function cycleAutoMode(s) {
  if (!s) return;
  let idx = 0;
  for (let i = 0; i < AUTO_MODES.length; i++) if (AUTO_MODES[i].id === s.autoMode) idx = i;
  idx = (idx + 1) % AUTO_MODES.length;
  setAutoMode(s, AUTO_MODES[idx].id);
  if (s.autoMode === 'radial' && !s.autoOrigin) toast('扩散模式：在战场上点一个格子作为中心');
  else toast('升级顺序：' + autoModeLabel(s.autoMode));
}
/* 自动升级设置面板 */
function openAutoModal() {
  if (!ensureModal()) return;
  const s = S;
  modalTitle.textContent = '自动升级设置';
  modalDesc.innerHTML = '开启后游戏会自动把<b style="color:#dff1f8;">多余金币</b>用于升级防御塔，' +
    '始终保留 <b style="color:#f4c451;">' + AUTO_RESERVE + '</b> 金币用于新建塔（最贵一座塔的造价）。<br>' +
    '升级顺序可选：智能（每金币收益最高）/ 从左到右 / 从右到左 / 从一个点扩散。';
  modalText.style.display = 'none';
  setModalMsg('', '#8aa6b4');
  modalBtns.innerHTML = '';
  modalButton(s && s.autoUp ? '自动升级：已开启 ✓' : '自动升级：已关闭', true, function () {
    if (S) { S.autoUp = !S.autoUp; toast(S.autoUp ? '自动升级已开启' : '自动升级已关闭'); }
    openAutoModal();
  });
  for (let i = 0; i < AUTO_MODES.length; i++) {
    const m = AUTO_MODES[i];
    const cur = s && s.autoMode === m.id;
    modalButton(m.label + (cur ? ' ✓' : ''), false, function () {
      setAutoMode(S, m.id);
      if (m.id === 'radial' && !S.autoOrigin) {
        closeModal();
        toast('请在战场上点击一个格子作为扩散中心');
        return;
      }
      openAutoModal();
    });
  }
  if (s && s.autoMode === 'radial') {
    modalButton('重新点选扩散中心', false, function () {
      closeModal();
      if (S) { S.pickOrigin = true; toast('请在战场上点击一个格子作为扩散中心'); }
    });
    modalDesc.innerHTML += '<br>当前中心：' +
      (s.autoOrigin ? ('第 ' + (s.autoOrigin.c + 1) + ' 列 · 第 ' + (s.autoOrigin.r + 1) + ' 行') : '尚未设置');
  }
  modalButton('关闭', false, closeModal);
  modalRoot.style.display = 'flex';
}
/* 导出本地存档（菜单用） */
function exportStoredSave() {
  const snap = readStoredSave();
  if (!snap) { toast('还没有可导出的存档，先打一局吧'); return; }
  openExportModal(encodeSaveCode(snap), snap);
}
/* 导出当前对局（暂停时用，拿到的是此刻的真实进度） */
function exportCurrentSave(s) {
  const snap = snapshot(s);
  if (!snap) { toast('当前没有进行中的对局'); return; }
  saveGame(s); // 先落盘，保证导出的码和本地存档一致
  openExportModal(encodeSaveCode(snap), snap);
}

/* ---------------- 轻提示 ---------------- */
let toastMsg = '', toastT = 0;
function toast(text) { toastMsg = text; toastT = 2.4; }function drawToast(ctx) {
  if (toastT <= 0) return;
  ctx.save();
  ctx.globalAlpha = Math.min(1, toastT);
  ctx.font = '600 13px "Microsoft YaHei","PingFang SC",system-ui,sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const w = ctx.measureText(toastMsg).width + 30;
  const x = (W - w) / 2, y = H - 96;
  rr(ctx, x, y, w, 30, 9);
  ctx.fillStyle = 'rgba(12,24,30,.94)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(110,203,255,.5)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = '#dff1f8';
  ctx.fillText(toastMsg, W / 2, y + 15);
  ctx.restore();
}
/* 扩散模式：把升级中心标出来，顺带提示正在等待点选 */
function drawAutoOrigin(ctx, s) {
  if (s.autoMode !== 'radial') return;
  if (s.pickOrigin) {
    txt(ctx, '请点击一个格子，作为自动升级的扩散中心', W / 2, FIELD_Y + FIELD_H - 26, 13, '#7de0c8', 'center', 700);
    if (!s.autoOrigin) return;
  }
  if (!s.autoOrigin) return;
  const x = cellCX(s.autoOrigin.c), y = cellCY(s.autoOrigin.r);
  ctx.save();
  const pulse = 0.5 + 0.5 * Math.sin(s.time * 3);
  ctx.beginPath();
  ctx.arc(x, y, 15 + pulse * 6, 0, 6.3);
  ctx.strokeStyle = 'rgba(125,224,200,' + (0.45 + pulse * 0.4).toFixed(3) + ')';
  ctx.lineWidth = 2;
  ctx.setLineDash([4, 4]);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.arc(x, y, 4, 0, 6.3);
  ctx.fillStyle = '#7de0c8';
  ctx.fill();
  txt(ctx, '扩散中心', Math.max(42, Math.min(W - 42, x)), y + 32, 11, '#7de0c8', 'center', 600);
  ctx.restore();
}

function handleClick(s, x, y) {
  if (!s || s.scene !== 'play') return;
  const R = uiRects(s);

  // 顶栏按钮
  if (inRect(R.speed, x, y)) { s.speed = s.speed === 1 ? 2 : (s.speed === 2 ? 3 : 1); return; }
  if (inRect(R.pause, x, y)) { s.paused = !s.paused; if (s.paused) saveGame(s); return; }
  if (inRect(R.mute, x, y)) { muted = !muted; return; }
  if (inRect(R.auto, x, y)) {
    s.autoUp = !s.autoUp;
    toast(s.autoUp ? ('自动升级已开启 · ' + autoModeLabel(s.autoMode) + '顺序') : '自动升级已关闭');
    return;
  }
  if (inRect(R.autoMode, x, y)) { cycleAutoMode(s); return; }

  // 暂停时只允许顶栏与暂停面板按钮，禁止建造/升级/出售/召唤等游戏操作
  if (s.paused) {
    const PR = pauseRects();
    if (inRect(PR.exportBtn, x, y)) { exportCurrentSave(s); return; }
    if (inRect(PR.importBtn, x, y)) { openImportModal(); return; }
    if (inRect(PR.autoBtn, x, y)) { openAutoModal(); return; }
    return;
  }

  // 波次呼叫
  if (s.phase === 'prep' && x >= R.wave.x + 12 && x <= R.wave.x + R.wave.w - 12 && y >= R.wave.y + 64 && y <= R.wave.y + 82) {
    callWaveEarly(s);
    return;
  }

  // 塔卡片
  for (let i = 0; i < R.cards.length; i++) {
    const c = R.cards[i];
    if (inRect(c, x, y)) {
      s.pick = (s.pick === c.key) ? null : c.key;
      s.sel = null;
      return;
    }
  }

  // 已选塔的升级 / 出售
  if (s.sel) {
    if (inRect(R.upBtn, x, y)) { upgradeTower(s, s.sel); return; }
    if (inRect(R.sellBtn, x, y)) { sellTower(s, s.sel); return; }
  }

  // 场地点击
  if (y >= FIELD_Y && y < BAR_Y) {
    const cell = cellFromPoint(x, y);
    /* 扩散模式：先让玩家在战场上点一个格子作为升级中心 */
    if (s.pickOrigin) {
      if (cell.c >= 0 && cell.r >= 0) {
        s.autoOrigin = { c: cell.c, r: cell.r };
        s.pickOrigin = false;
        s.pick = null;
        s.sel = null;
        toast('扩散中心已设置');
      }
      return;
    }
    const hit = hitTowerAt(s, x, y);
    if (hit) { s.sel = (s.sel === hit) ? null : hit; s.pick = null; return; }
    if (s.pick) {
      const res = placeTower(s, s.pick, cell.c, cell.r);
      if (!res.ok) {
        addFloat(s, x, y - 10, res.why, C.bad);
        sfx(160, 0.09, 'square', 0.03);
      }
      // 金币不足则取消选择，避免反复误点
      if (!res.ok && s.gold < TOWERS[s.pick].cost) s.pick = null;
      return;
    }
    s.sel = null;
  }
}

function handleMove(s, x, y) {
  const cell = cellFromPoint(x, y);
  s.hover.c = cell.c;
  s.hover.r = cell.r;
  const R = uiRects(s);
  s.autoHover = null;
  if (inRect(R.auto, x, y)) s.autoHover = 'auto';
  else if (inRect(R.autoMode, x, y)) s.autoHover = 'autoMode';
  /* 暂停面板按钮悬停 */
  if (s.paused) {
    const PR = pauseRects();
    s.pauseHover = null;
    if (inRect(PR.exportBtn, x, y)) s.pauseHover = 'export';
    else if (inRect(PR.importBtn, x, y)) s.pauseHover = 'import';
    else if (inRect(PR.autoBtn, x, y)) s.pauseHover = 'auto';
  }
}

function bindInput(canvas, getState) {
  function toLocal(ev) {
    const r = canvas.getBoundingClientRect();
    /* 画布铺满视口，需要扣掉居中留白再按缩放比还原到逻辑坐标 */
    const k = view.k || 1;
    return { x: (ev.clientX - r.left - view.ox) / k, y: (ev.clientY - r.top - view.oy) / k };
  }
  canvas.addEventListener('pointerdown', function (ev) {
    // 右键只负责取消选择，不能先触发一次建造或按钮点击
    if (ev.button !== 0) return;
    ev.preventDefault();
    const s = getState();
    const p = toLocal(ev);
    if (s.scene === 'menu') {
      const R = menuRects();
      if (hasSave() && inRect(R.continueBtn, p.x, p.y)) { startContinue(); return; }
      if (inRect(R.exportBtn, p.x, p.y)) { exportStoredSave(); return; }
      if (inRect(R.importBtn, p.x, p.y)) { openImportModal(); return; }
      for (let i = 0; i < R.btns.length; i++) {
        if (inRect(R.btns[i], p.x, p.y)) { startNewRun(R.btns[i].mode); return; }
      }
      return;
    }
    if (s.scene === 'win' || s.scene === 'lose') {
      const R = overRects();
      if (inRect(R.restart, p.x, p.y)) { startNewRun(s.mode); return; }
      if (inRect(R.menu, p.x, p.y)) { showMenu(); return; }
      return;
    }
    handleClick(s, p.x, p.y);
  });
  canvas.addEventListener('pointermove', function (ev) {
    const s = getState();
    const p = toLocal(ev);
    handleMove(s, p.x, p.y);
    if (s.scene === 'menu') {
      const R = menuRects();
      s.menuHover = null;
      if (hasSave() && inRect(R.continueBtn, p.x, p.y)) s.menuHover = 'continue';
      else if (inRect(R.exportBtn, p.x, p.y)) s.menuHover = 'export';
      else if (inRect(R.importBtn, p.x, p.y)) s.menuHover = 'import';
      for (let i = 0; i < R.btns.length; i++) if (inRect(R.btns[i], p.x, p.y)) s.menuHover = R.btns[i].mode;
    }
  });
  canvas.addEventListener('pointerleave', function () {
    const s = getState();
    s.hover.c = -1; s.hover.r = -1;
  });
  canvas.addEventListener('contextmenu', function (ev) {
    ev.preventDefault();
    const s = getState();
    s.pick = null; s.sel = null;
  });

  global.addEventListener('keydown', function (ev) {
    const s = getState();
    if (!s) return;
    const raw = (typeof ev.key === 'string') ? ev.key : '';
    const k = raw.toLowerCase();
    /* 弹窗打开时，游戏快捷键全部让位给文本框（Esc 关闭弹窗） */
    if (modalOpen()) {
      if (k === 'escape') closeModal();
      return;
    }
    if (k === ' ' || k === 'p') {
      ev.preventDefault();
      if (s.scene === 'play') { s.paused = !s.paused; if (s.paused) saveGame(s); }
      return;
    }
    if (s.scene === 'menu') {
      if (k === '1') startNewRun('easy');
      if (k === '2') startNewRun('normal');
      if (k === '3') startNewRun('hard');
      if (k === '4') startNewRun('endless');
      if (k === '5') startNewRun('forge');
      if ((k === 'c' || k === '6') && hasSave()) startContinue();
      return;
    }
    if (s.scene === 'win' || s.scene === 'lose') {
      if (k === 'r' || k === 'enter') startNewRun(s.mode);
      return;
    }
    if (s.paused) return;
    /* 数字键用数值比较，避免字符串比较在塔种变多后错乱（如 '7' > '6' 为真） */
    const num = (raw.length === 1) ? parseInt(raw, 10) : NaN;
    if (num >= 1 && num <= TOWER_KEYS.length) {
      const key = TOWER_KEYS[num - 1];
      s.pick = (s.pick === key) ? null : key;
      s.sel = null;
    } else if (k === 'escape') {
      s.pick = null; s.sel = null;
    } else if (k === 'u') {
      if (s.sel) upgradeTower(s, s.sel);
    } else if (k === 'x') {
      if (s.sel) sellTower(s, s.sel);
    } else if (k === 'r') {
      startNewRun(s.mode);
    } else if (k === 'n') {
      callWaveEarly(s);
    } else if (k === 'm') {
      muted = !muted;
    } else if (k === 'f') {
      s.speed = s.speed === 1 ? 2 : (s.speed === 2 ? 3 : 1);
    } else if (k === 'a') {
      s.autoUp = !s.autoUp;
      toast(s.autoUp ? ('自动升级已开启 · ' + autoModeLabel(s.autoMode) + '顺序') : '自动升级已关闭');
    }
  });
}

/* ---------------- 启动 ---------------- */
let S = null;
let canvasEl = null, ctxEl = null, DPR = 1;
/* 视口适配状态：k 缩放比，ox/oy 居中偏移，vw/vh 视口尺寸（CSS 像素） */
const view = { k: 1, ox: 0, oy: 0, vw: W, vh: H, dpr: 1 };

function startNewRun(mode) {
  clearSave(); // 主动开新局即放弃旧存档
  S = newGame(mode);
  sfx(440, 0.1, 'sine', 0.05);
}
function startContinue() {
  const s = loadGame();
  if (s) { S = s; sfx(440, 0.1, 'sine', 0.05); }
}
function showMenu() {
  S = newGame('normal');
  S.scene = 'menu';
  S.menuHover = null;
}

/* 视口内等比适配：k 为缩放比，ox/oy 为居中偏移（逻辑坐标 → 视口像素） */
/* 由视口尺寸算出等比适配参数（纯函数，便于测试）：
   k 为缩放比，ox/oy 为居中偏移，逻辑坐标 x 对应视口 ox + x * k */
function fitView(vw, vh) {
  const k = Math.min(vw / W, vh / H);
  return { k: k, ox: (vw - W * k) / 2, oy: (vh - H * k) / 2 };
}

function resize(canvas) {
  const vw = Math.max(320, global.innerWidth || W);
  const vh = Math.max(240, global.innerHeight || H);
  const f = fitView(vw, vh);
  const k = f.k;
  /* 画布现在铺满视口，像素量随窗口增长：按总面积限一下 DPR，避免大屏掉帧 */
  let dpr = Math.min(2, global.devicePixelRatio || 1);
  const MAX_PIX = 4.2e6;
  if (vw * vh * dpr * dpr > MAX_PIX) dpr = Math.max(1, Math.sqrt(MAX_PIX / (vw * vh)));
  DPR = dpr;
  view.k = k;
  view.vw = vw; view.vh = vh; view.dpr = DPR;
  view.ox = f.ox;
  view.oy = f.oy;
  canvas.style.width = vw + 'px';
  canvas.style.height = vh + 'px';
  canvas.width = Math.round(vw * DPR);
  canvas.height = Math.round(vh * DPR);
}

function boot() {
  canvasEl = (typeof document !== 'undefined') ? document.getElementById('game') : null;
  if (!canvasEl || !canvasEl.getContext) return;
  ctxEl = canvasEl.getContext('2d');
  resize(canvasEl);
  global.addEventListener('resize', function () { resize(canvasEl); });
  bindInput(canvasEl, function () { return S; });
  showMenu();

  let last = 0;
  function loop(ts) {
    if (!last) last = ts;
    let dt = (ts - last) / 1000;
    last = ts;
    if (dt > 0.25) dt = 0.25;
    toastT = Math.max(0, toastT - dt);
    step(S, dt);
    ctxEl.setTransform(DPR, 0, 0, DPR, 0, 0);
    draw(S, ctxEl);
    global.requestAnimationFrame(loop);
  }
  global.requestAnimationFrame(loop);
}

/* ---------------- 对外 API（也可用于自动化测试） ---------------- */
const api = {
  W: W, H: H, CELL: CELL, PATH: PATH, TOWERS: TOWERS, ENEMIES: ENEMIES, WAVES: WAVES,
  DIFF: DIFF, MAX_LV: MAX_LV, LEVELS: LEVELS, FORGE_WAVES: FORGE_WAVES,
  newGame: newGame, step: step, draw: draw, spawnEnemy: spawnEnemy,
  damageEnemy: damageEnemy, applyVenom: applyVenom, applySlow: applySlow,
  areaDamage: areaDamage, chainLightning: chainLightning, clearDead: clearDead,
  placeTower: placeTower, upgradeTower: upgradeTower, sellTower: sellTower,
  startWave: startWave, callWaveEarly: callWaveEarly, waveDef: waveDef,
  wavesOf: wavesOf, totalWaves: totalWaves, diffOf: diffOf, levelOf: levelOf,
  ampBoost: ampBoost,
  buildableCells: buildableCells, cellFree: cellFree, towerStats: towerStats,
  upgradeCost: upgradeCost, sellValue: sellValue, hpScale: hpScale,
  TOWER_KEYS: TOWER_KEYS, TOTAL_WAVES: TOTAL_WAVES,
  state: function () { return S; },
  click: handleClick, uiRects: uiRects, menuRects: menuRects, overRects: overRects,
  bindInput: bindInput, loadEndlessBest: loadEndlessBest, saveEndlessBest: saveEndlessBest,
  fitView: fitView, view: function () { return view; },
  saveGame: saveGame, loadGame: loadGame, hasSave: hasSave, clearSave: clearSave,
  saveInfo: saveInfo,
  encodeSaveCode: encodeSaveCode, decodeSaveCode: decodeSaveCode,
  importSaveCode: importSaveCode, validateSnapshot: validateSnapshot,
  readStoredSave: readStoredSave, saveCodeFilename: saveCodeFilename,
  fnv1a: fnv1a, b64encode: b64encode, b64decode: b64decode,
  utf8Bytes: utf8Bytes, utf8String: utf8String,
  autoUpgradeTick: autoUpgradeTick, autoUpgradeOrder: autoUpgradeOrder,
  towerValueGain: towerValueGain, setAutoMode: setAutoMode, cycleAutoMode: cycleAutoMode,
  AUTO_RESERVE: AUTO_RESERVE, AUTO_MODES: AUTO_MODES,
  boot: boot, muted: function (v) { if (v !== undefined) muted = !!v; return muted; }
};
if (typeof global.TD === 'undefined') global.TD = api;

if (typeof document !== 'undefined' && document.getElementById && !global.__TD_NO_BOOT__) {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
}

})(typeof window !== 'undefined' ? window : this);
</script>
